<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStock — Inicio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/nav.css">
</head>
<body data-page="inicio">
<div class="app">
  <nav class="topbar" id="sidebarRoot"></nav>
  <main>
    <section>
      <header class="view-head">
        <h2 id="saludo">Inicio</h2>
        <p>Resumen del día: alertas de existencias y caducidades de tu sucursal.</p>
      </header>
      <div class="stat-grid" id="kpis"></div>
      <div id="notificaciones"></div>
      <div id="extrasInicio"></div>
      <div class="panel">
        <div class="form-section-title" style="margin-top:0">Accesos rápidos</div>
        <div class="quick-grid" id="accesos"></div>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/pages/inicio.js"></script>
<script>
  const session = requireSession(['dueno','empleado']);
  if(session){ renderNav(session); Promise.resolve(initPage(session)).catch(e => toast(e.message, true)); }
</script>
</body>
</html>
