<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStock — Avisos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/nav.css">
</head>
<body data-page="avisos">
<div class="app">
  <nav class="topbar" id="sidebarRoot"></nav>
  <main>
    <section>
      <header class="view-head">
        <h2>Avisos a las sucursales</h2>
        <p>Mensajes de novedades o mantenimiento que los gerentes y empleados ven en su pantalla de Inicio.</p>
      </header>
      <div class="panel">
        <div class="form-section-title" style="margin-top:0" id="avTituloForm">Nuevo aviso</div>
        <div class="form-grid">
          <div class="full"><label for="avTitulo">Título *</label><input type="text" id="avTitulo" maxlength="120" placeholder="Ej. Mantenimiento programado el sábado"></div>
          <div class="full"><label for="avMensaje">Mensaje *</label><textarea id="avMensaje" rows="3" maxlength="600" placeholder="Qué pasa, cuándo y qué debe hacer la sucursal (si aplica)."></textarea></div>
          <div><label for="avTipo">Tipo</label><select id="avTipo"><option>Novedad</option><option>Mantenimiento</option><option>Importante</option></select></div>
          <div><label for="avPlan">Dirigido a</label><select id="avPlan"></select></div>
          <div><label for="avVence">Visible hasta <span style="font-weight:400">(opcional)</span></label><input type="date" id="avVence"></div>
        </div>
        <div class="form-actions">
          <button class="btn" id="avGuardar">Publicar aviso</button>
          <button class="btn secondary" id="avCancelar" hidden>Cancelar edición</button>
        </div>
      </div>
      <div class="card-list" id="avLista"></div>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/pages/avisos.js"></script>
<script>
  const session = requireSession(['superadmin']);
  if(session){ renderNav(session); Promise.resolve(initPage(session)).catch(e => toast(e.message, true)); }
</script>
</body>
</html>
