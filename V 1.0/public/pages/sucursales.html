<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStock — Sucursales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/nav.css">
</head>
<body data-page="sucursales">
<div class="app">
  <nav class="topbar" id="sidebarRoot"></nav>
  <main>
    <section>
      <header class="view-head">
        <h2>Sucursales</h2>
        <p>Revisa solicitudes, consulta la ficha de cada farmacia y aprueba, rechaza, suspende o reactiva.</p>
      </header>
      <div class="filters">
        <input type="text" id="sucBuscar" placeholder="Buscar por nombre, responsable o correo" aria-label="Buscar sucursal" style="min-width:280px">
        <select id="sucFiltro" aria-label="Estado">
          <option value="">Todos los estados</option>
          <option value="Pendiente">Pendientes</option>
          <option value="Activa">Activas</option>
          <option value="Suspendida">Suspendidas</option>
          <option value="Rechazada">Rechazadas</option>
        </select>
        <select id="sucPlan" aria-label="Plan"><option value="">Todos los planes</option></select>
      </div>
      <div class="panel table-wrap" style="padding:0; overflow:hidden;">
        <table>
          <thead><tr><th>Sucursal</th><th>Responsable</th><th>Plan</th><th>Uso</th><th>Último acceso</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody id="sucBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/pages/sucursales.js"></script>
<script>
  const session = requireSession(['superadmin']);
  if(session){ renderNav(session); Promise.resolve(initPage(session)).catch(e => toast(e.message, true)); }
</script>
</body>
</html>
