<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStock — Usuarios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/nav.css">
</head>
<body data-page="cuentas">
<div class="app">
  <nav class="topbar" id="sidebarRoot"></nav>
  <main>
    <section>
      <header class="view-head">
        <h2>Usuarios de la plataforma</h2>
        <p>Busca cualquier cuenta, restablece contraseñas, activa o desactiva accesos y da de alta a otros administradores.</p>
      </header>
      <div class="panel">
        <div class="form-section-title" style="margin-top:0">Nuevo superadministrador</div>
        <div class="form-grid">
          <div><label for="cuNombre">Nombre completo *</label><input type="text" id="cuNombre" maxlength="120"></div>
          <div><label for="cuCorreo">Correo *</label><input type="email" id="cuCorreo" maxlength="120"></div>
          <div><label for="cuPass">Contraseña temporal * <span style="font-weight:400">(mín. 8 caracteres)</span></label><input type="password" id="cuPass" autocomplete="new-password"></div>
          <div style="align-self:end"><button class="btn" id="cuCrear">Crear administrador</button></div>
        </div>
      </div>
      <div class="filters">
        <input type="text" id="cuBuscar" placeholder="Buscar por nombre, correo o sucursal" aria-label="Buscar usuario" style="min-width:280px">
        <select id="cuRol" aria-label="Rol">
          <option value="">Todos los roles</option><option value="superadmin">Superadministradores</option><option value="dueno">Gerentes</option><option value="empleado">Empleados</option>
        </select>
        <select id="cuEstado" aria-label="Estado"><option value="">Activos e inactivos</option><option value="Activo">Activos</option><option value="Inactivo">Inactivos</option></select>
      </div>
      <div class="panel table-wrap" style="padding:0; overflow:hidden;">
        <table>
          <thead><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Sucursal</th><th>Último acceso</th><th>Estado</th><th>Acciones</th></tr></thead>
          <tbody id="cuBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/pages/cuentas.js"></script>
<script>
  const session = requireSession(['superadmin']);
  if(session){ renderNav(session); Promise.resolve(initPage(session)).catch(e => toast(e.message, true)); }
</script>
</body>
</html>
