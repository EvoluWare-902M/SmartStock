<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStock — Recomendación de compras</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/nav.css">
</head>
<body data-page="recomendacion">
<div class="app">
  <nav class="topbar" id="sidebarRoot"></nav>
  <main>
    <section>
      <header class="view-head">
        <h2>Recomendación de compras</h2>
        <p>Cantidades sugeridas a partir de la demanda estimada por el modelo, el stock útil y el mínimo de cada producto.</p>
      </header>
      <div class="toolbar">
        <div id="recoResumen" class="muted"></div>
        <div class="row-actions">
          <button class="btn secondary" id="recoPdf">Descargar PDF</button>
          <button class="btn secondary" id="recoXlsx">Descargar Excel</button>
        </div>
      </div>
      <div class="card-list" id="recoList"></div>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/pages/recomendacion.js"></script>
<script>
  const session = requireSession(['dueno']);
  if(session){ renderNav(session); Promise.resolve(initPage(session)).catch(e => toast(e.message, true)); }
</script>
</body>
</html>
