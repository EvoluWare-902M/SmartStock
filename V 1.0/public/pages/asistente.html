<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStock — Asistente</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/nav.css">
</head>
<body data-page="asistente">
<div class="app">
  <nav class="topbar" id="sidebarRoot"></nav>
  <main>
    <section>
      <header class="view-head">
        <h2>Asistente <span class="ia-tag">IA</span></h2>
        <p id="asModo">Pregunta en tus propias palabras por ubicaciones, existencias, caducidades o compras.</p>
      </header>
      <div class="chat">
        <div class="chat-mensajes" id="asMensajes" aria-live="polite"></div>
        <div class="chat-sugerencias" id="asSugerencias"></div>
        <form class="chat-entrada" id="asForm">
          <input type="text" id="asTexto" placeholder="Escribe tu pregunta…" maxlength="500" autocomplete="off" aria-label="Tu pregunta">
          <button class="btn" id="asEnviar">Enviar</button>
        </form>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/pages/asistente.js"></script>
<script>
  const session = requireSession(['dueno', 'empleado']);
  if(session){ renderNav(session); Promise.resolve(initPage(session)).catch(e => toast(e.message, true)); }
</script>
</body>
</html>
