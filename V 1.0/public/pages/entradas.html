<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStock — Entradas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="../img/favicon.png">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/nav.css">
</head>
<body data-page="entradas">
<div class="app">
  <nav class="topbar" id="sidebarRoot"></nav>
  <main>
    <section>
      <header class="view-head">
        <h2>Entrada de mercancía</h2>
        <p>Registra un nuevo lote recibido para actualizar el inventario y conservar la trazabilidad.</p>
      </header>
      
      <div class="panel">
        <div class="form-section-title">Datos de la compra</div>
        <div class="form-grid">
          <div>
            <label for="enProveedor">Proveedor *</label>
            <input type="text" id="enProveedor" list="enProveedores" placeholder="Ej. Distribuidora Salud S.A.">
            <datalist id="enProveedores"></datalist>
          </div>
          <div>
            <label for="enFactura">Número de factura / folio</label>
            <input type="text" id="enFactura" placeholder="Ej. F-1120">
          </div>
        </div>
      
        <div class="form-section-title">Producto y lote</div>
        <div class="form-grid">
          <div>
            <label for="enProducto">Medicamento *</label>
            <select id="enProducto"></select>
          </div>
          <div>
            <label for="enLote">Lote *</label>
            <input type="text" id="enLote" placeholder="Ej. L-2600">
            <div class="hint">Si el lote ya existe, la cantidad se suma a ese lote.</div>
          </div>
          <div>
            <label for="enCaducidad">Fecha de caducidad del lote *</label>
            <input type="date" id="enCaducidad">
          </div>
          <div>
            <label for="enCantidad">Cantidad *</label>
            <input type="number" id="enCantidad" min="1" placeholder="Ej. 25">
          </div>
          <div>
            <label for="enCosto">Costo unitario</label>
            <input type="number" id="enCosto" min="0" step="0.01" placeholder="Ej. 18.50">
          </div>
          <div>
            <label for="enFecha">Fecha de entrada *</label>
            <input type="date" id="enFecha">
          </div>
          <div class="full">
            <label for="enObs">Observaciones</label>
            <textarea id="enObs" rows="2" placeholder="Opcional"></textarea>
          </div>
        </div>
      
        <div id="enInfo" class="found-card" style="display:none"></div>
        <div class="form-actions">
          <button class="btn" id="enGuardar">Registrar entrada</button>
        </div>
      </div>
      
      <div class="panel table-wrap" style="padding:0; overflow:hidden;">
        <table>
          <thead><tr><th>Fecha</th><th>Producto</th><th>Lote</th><th>Cantidad</th><th>Proveedor</th><th>Factura</th><th>Registró</th></tr></thead>
          <tbody id="enBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="../js/api.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/pages/entradas.js"></script>
<script>
  const session = requireSession(['dueno']);
  if(session){ renderNav(session); Promise.resolve(initPage(session)).catch(e => toast(e.message, true)); }
</script>
</body>
</html>
