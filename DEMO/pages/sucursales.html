<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartStock — Sucursales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body data-page="sucursales">
<div class="app">
  <nav class="side" id="sidebarRoot"></nav>
  <main>
    <section>
      <header class="view-head">
        <h2>Sucursales</h2>
        <p>Aprueba, suspende o reactiva las farmacias registradas en la plataforma.</p>
      </header>

      <div class="stat-grid" id="sucStats"></div>

      <div class="filters">
        <select id="sucFiltro">
          <option value="">Todos los estados</option>
          <option value="Activa">Activas</option>
          <option value="Pendiente">Pendientes</option>
          <option value="Suspendida">Suspendidas</option>
        </select>
      </div>

      <div class="panel table-wrap" style="padding:0; overflow:hidden;">
        <table>
          <thead><tr>
            <th>Sucursal</th><th>Dueño</th><th>Correo</th><th>Teléfono</th>
            <th>Plan</th><th>Estado</th><th>Alta</th><th>Acción</th>
          </tr></thead>
          <tbody id="sucBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</div>

<div id="toast"></div>
<script src="../js/data.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/pages/sucursales.js"></script>
<script>
  const session = requireSession(['superadmin']);
  if(session){ renderNav(session); initPage(session); }
</script>
</body>
</html>
